name: Deploy Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "26.1.10909125"
          cmake: "3.22.1"

      - name: Install npm dependencies
        working-directory: Frontend
        run: npm ci

      - name: Generate release keystore
        run: |
          cd Frontend/android/app
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore release-key.keystore \
            -alias miniledger \
            -keyalg RSA \
            -keysize 2048 \
            -validity 100000 \
            -storepass android \
            -keypass android \
            -dname "CN=MiniLedger, OU=Development, O=MiniLedger, L=NA, S=NA, C=US"

      - name: Configure gradle.properties for signing
        run: |
          # Ensure there is a newline at the end of the file before appending
          echo "" >> Frontend/android/gradle.properties
          cat >> Frontend/android/gradle.properties << 'EOF'
          MYAPP_RELEASE_STORE_FILE=release-key.keystore
          MYAPP_RELEASE_STORE_PASSWORD=android
          MYAPP_RELEASE_KEY_ALIAS=miniledger
          MYAPP_RELEASE_KEY_PASSWORD=android
          EOF

      - name: Add release signing config to build.gradle
        run: |
          python3 << 'PYEOF'
          import re

          filepath = "Frontend/android/app/build.gradle"
          with open(filepath, "r") as f:
              content = f.read()

          # Add release signingConfig inside signingConfigs block
          release_block = '''    release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
          '''
          # Insert release config right after "signingConfigs {"
          content = content.replace(
              'signingConfigs {\n',
              'signingConfigs {\n' + release_block
          )

          # Switch release buildType to use release signingConfig
          content = content.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release'
          )

          # Enable minify and shrink resources
          content = content.replace(
              'minifyEnabled enableProguardInReleaseBuilds',
              'minifyEnabled true\n            shrinkResources true'
          )

          # Ensure proguardFiles line is present
          if 'proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' not in content:
              content = content.replace(
                  'minifyEnabled true\n            shrinkResources true',
                  'minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
              )

          with open(filepath, "w") as f:
              f.write(content)

          print("build.gradle updated successfully")
          PYEOF

      - name: Print modified signingConfigs section
        run: |
          grep -A 20 'signingConfigs' Frontend/android/app/build.gradle | head -30

      - name: Build release APK with R8 + resource shrinking
        working-directory: Frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PenableProguardInReleaseBuilds=true \
            --no-daemon \
            --stacktrace

      - name: Zipalign and sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK_UNSIGNED="Frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_FINAL="MiniLedger.apk"
          
          if [ -f "$APK_UNSIGNED" ]; then
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -c 4 "$APK_UNSIGNED" 2>/dev/null || \
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v 4 "$APK_UNSIGNED" "$APK_FINAL"
            echo "APK_SIZE=$(du -h MiniLedger.apk | cut -f1)" >> $GITHUB_ENV
          else
            APK_PATH=$(find Frontend/android/app/build/outputs/apk/release -name "*.apk" -print -quit)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" "$APK_FINAL"
              echo "APK_SIZE=$(du -h MiniLedger.apk | cut -f1)" >> $GITHUB_ENV
            else
              echo "ERROR: No APK found" && exit 1
            fi
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./MiniLedger.apk
          name: "MiniLedger v${{ github.ref_name }}"
          body: |
            ## MiniLedger v${{ github.ref_name }}
            
            Download and install the APK below to try the latest version.
            
            ### Installation
            1. Enable "Install from Unknown Sources" on your Android device
            2. Download the APK file
            3. Tap on the file to install
            
            ### Notes
            - When using the APK over WiFi (without USB), update the API URL in the app to your computer's local IP address
            - APK size: ${{ env.APK_SIZE }}
            
            ### Build info
            - Build by: GitHub Actions
            - Commit: ${{ github.sha }}

      - name: Cleanup
        if: always()
        run: |
          rm -f Frontend/android/app/release-key.keystore